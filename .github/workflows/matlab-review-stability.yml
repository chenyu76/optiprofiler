name: MATLAB review stability
on:
  push:
    branches: [fix/2.0-review-fixes]
  pull_request:
    branches: [main, matlab]
  workflow_dispatch:
jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: matlab-actions/setup-matlab@v2
        with:
          products: Optimization_Toolbox Parallel_Computing_Toolbox
      - uses: matlab-actions/run-command@v2.1.1
        with:
          command: |
            addpath(fullfile(pwd,'matlab','optiprofiler','src'));
            t=fullfile(pwd,'matlab','optiprofiler','tests','unit_tests');
            s=[testsuite(fullfile(t,'TestReviewRuntimeContracts.m')), testsuite(fullfile(t,'TestReferenceHistoryDiagnostics.m')), testsuite(fullfile(t,'TestParallelFailureContract.m'))];
            runner=matlab.unittest.TestRunner.withTextOutput;
            runner.addPlugin(matlab.unittest.plugins.XMLPlugin.producingJUnitFormat('review-stability.xml'));
            r=runner.run(s);
            assert(all([r.Passed]),'Review stability tests failed or incomplete');
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matlab-review-stability-${{ matrix.os }}-${{ github.sha }}
          path: review-stability.xml
